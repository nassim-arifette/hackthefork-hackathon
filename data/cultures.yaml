# Hypothèses propres aux autres légumineuses, pour le même moteur (pipeline/09_cultures.py).
# Tout ce qui n'est pas ici reprend data/hypotheses.yaml : charges du blé, prix du blé rejoué,
# fiabilité visée, transport. Étiquettes : source | suppose.
# Relevé du 31/10/2026. Les PDF Terres Inovia n'ont pas pu être rouverts depuis l'environnement
# de développement : leurs chiffres viennent des extraits des résultats de recherche, à relire.

pois_chiche:
  nom: Pois chiche
  charges_eur_ha:
    valeur: 500
    etiquette: source
    source: "charges opérationnelles le plus souvent de 400 à 500 €/ha, désherbage mécanique compris (guide de culture pois chiche Terres Inovia 2026) ; haut de fourchette retenu"
    url: "https://www.terresinovia.fr/sites/default/files/2026-04/guide_culture_pois-chiche_2026_terresinovia.pdf"
    sensibilite: [400, 500, 600]
  aide_eur_ha:
    valeur: 105
    etiquette: suppose
    source: "même aide couplée que la lentille : le pois chiche figure parmi les légumineuses à graines éligibles (liste des cultures 2023, DDT des Hautes-Pyrénées) ; montant 2026 indicatif"
    url: "https://www.hautes-pyrenees.gouv.fr/contenu/telechargement/13616/94119/file/20230307_liste_des_cultures_aides_couplees_2023.pdf"
  rotation_eur_ha:
    valeur: 150
    etiquette: source
    source: "économie sur la culture suivante jusqu'à 150 €/ha (guide de culture pois chiche Terres Inovia 2026)"
    url: "https://www.terresinovia.fr/sites/default/files/2026-04/guide_culture_pois-chiche_2026_terresinovia.pdf"
  part_refusee:
    valeur: 0.10
    etiquette: suppose
    source: "même hypothèse que la lentille : graines pour l'alimentation humaine, triées"
  prix_reference: null

