  part_refusee:
    valeur: 0.10
    etiquette: suppose
    source: "même hypothèse que la lentille : graines pour l'alimentation humaine, triées"
  prix_reference: null

pois:
  nom: Pois protéagineux
  charges_eur_ha:
    valeur: 400
    etiquette: suppose
    source: "postes de la Chambre d'agriculture Centre-Val de Loire en 2018 (semences 60, fertilisation 60 à 80, herbicides 80 à 120, fongicides 40 €/ha), relevés pour la hausse des intrants"
    url: "https://wiki.tripleperformance.fr/images/fr/8/86/CA_Centre_Val_de_Loire_-_Panneau_Cultures_Avenir_2018_-10_Cultures.pdf"
    sensibilite: [300, 400, 500]
  aide_eur_ha:
    valeur: 105
    etiquette: suppose
    source: "aide couplée aux légumineuses à graines, montant indicatif 2026 ; le guide pois 2025 de Terres Inovia retient 110 €/ha"
    url: "https://www.terresinovia.fr/sites/default/files/2025-05/guide-de-culture-pois-conventionnel-2025.pdf"
  rotation_eur_ha:
    valeur: 150
    etiquette: suppose
    source: "effet du pois sur le blé suivant : +7 q/ha et −33 kg N/ha (Réussir, citant Intercéréales et Terres Univia), soit environ 180 €/ha ; 150 retenus, comme pour la lentille"
    url: "https://www.reussir.fr/decarbonation-il-faudrait-supprimer-600-000-ha-de-cereales-au-profit-des-legumineuses-et-du"
  part_refusee:
    valeur: 0.05
    etiquette: suppose
    source: "débouchés moins exigeants que l'alimentation directe (ingrédients protéiques, alimentation animale)"
  prix_reference:
    valeur: [200, 260]
    etiquette: source
    source: "référentiel de prix CRIT Grand Est 2025, pois protéagineux et féveroles"
    url: "https://draaf.grand-est.agriculture.gouv.fr/IMG/pdf/crit_16_avril_2025___annexe_2___referentiel_des_prix_crit_2025.pdf"

