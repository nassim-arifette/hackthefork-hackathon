bonus_rotation_eur_ha:
  valeur: 150
  etiquette: suppose
  source: "bénéfice pour le blé suivant : 0,6 t/ha × 200 €/t + 25 kg N/ha × 1,2 €/kg ; effet précédent de la lentille documenté par FiloLeg / Agro-Transfert 2024 (+7 q/ha, −55 kg N/ha), montant choisi par l'équipe"
  url: "https://filoleg.fr/wp-content/uploads/2024/12/Synthese-technico-economique-insertion-LAG.pdf"
  sensibilite: [0, 100, 150, 200]
