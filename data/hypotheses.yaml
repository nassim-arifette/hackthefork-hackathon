  etiquette: suppose
  source: "arrondi de 518 €/ha de charges opérationnelles, guide de culture lentille Terres Inovia 2023"
  url: "https://www.terresinovia.fr/sites/default/files/2025-06/guide-de-culture-lentille-2023.pdf"
