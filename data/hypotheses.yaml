# Toutes les valeurs qui ne sont pas des données mesurées du pipeline, au même endroit.
# etiquette : mesure | source | suppose | synthetique
# Le prix du blé n'est pas une hypothèse : c'est la série data/prix_ble.csv
# (indice Eurostat mesuré, calé en niveau sur Agreste), rééchantillonnée avec l'année météo.
#
# Scénario central du 31/10 (version 4), issu de la revue documentée de docs/QUESTIONS.md.
# Le scénario du 30/10 (version 3) reste reproductible : scenario_historique ci-dessous.

charges_ble_eur_ha:
  valeur: 700
  etiquette: suppose
  source: "arrondi de 675 €/ha : projection Cerfrance Nord-Est Île-de-France citée par le guide pois Terres Inovia 2025 (8,5 t/ha × 200 €/t − 1 025 €/ha de marge brute)"
  url: "https://www.terresinovia.fr/sites/default/files/2025-05/guide-de-culture-pois-conventionnel-2025.pdf"
  sensibilite: [600, 700, 800]
charges_lentille_eur_ha:
