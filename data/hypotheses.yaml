aide_couplee_eur_ha:
  valeur: 105
  etiquette: source
  source: "aide couplée aux légumineuses à graines, montant indicatif de la campagne 2026, lentilles éligibles quelle que soit leur destination (notice Telepac 2026, p. 4) ; 122 €/ha était le montant définitif de 2025"
  url: "https://www3.telepac.agriculture.gouv.fr/telepac/pdf/tas/2026/Dossier-PAC-2026_notice_aides-couplees.pdf"
