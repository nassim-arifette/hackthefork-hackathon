# Toutes les valeurs qui ne sont pas des données mesurées du pipeline, au même endroit.
# etiquette : mesure | source | suppose | synthetique
# Le prix du blé est une référence reconstruite à partir d'Eurostat et d'Agreste,
# pas un prix payé à chaque producteur ; il est rééchantillonné avec l'année météo.

charges_ble_eur_ha:
  valeur: 440
  etiquette: source
  source: "Arvalis, charges opérationnelles du blé tendre en 2020 (semences, engrais, phytos)"
  url: "https://www.terre-net.fr/syndicalisme-agricole/article/223927/les-couts-de-production-ne-seront-pas-couverts-en-2023-alertent-les-cerealiers"
  sensibilite: [440, 520, 600]
charges_lentille_eur_ha:
  valeur: 280
  etiquette: source
  source: "Triple Performance, fiche lentille : semences 120, fertilisation 30, herbicides 80, fongicides 40, insecticides 10 €/ha (valeurs indicatives)"
