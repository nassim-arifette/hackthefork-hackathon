# Toutes les valeurs non mesurées du projet, au même endroit.
# etiquette : mesure | source | suppose | synthetique
# Les valeurs « provisoire » sont des ordres de grandeur de l'équipe, à remplacer
# par des références sourcées (Arvalis, Terres Inovia, chambres d'agriculture,
# FranceAgriMer). Elles sont affichées comme « supposé » dans l'application.

prix_ble_eur_t:
