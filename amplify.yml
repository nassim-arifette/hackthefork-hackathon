# Hébergement de l'application sur AWS Amplify, quand le dépôt GitHub est connecté.
# L'application vit dans app/ ; Amplify y lance le build et publie app/dist.
version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
